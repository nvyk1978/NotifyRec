name: Build NotifyRec APK
run-name: NotifyRec build #${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "source.zip"
      - ".github/workflows/notifyrec-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract source.zip
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q source.zip -d extracted
          test -f extracted/settings.gradle.kts
          test -f extracted/build.gradle.kts
          test -f extracted/app/build.gradle.kts
          test -f extracted/app/notifyrec-debug.jks
          test -f extracted/app/src/main/AndroidManifest.xml

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' extracted/app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' extracted/app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          SAFE_VERSION="$(printf '%s' "$VERSION_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "safe=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "NotifyRec versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        working-directory: extracted
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Create versioned APK
        shell: bash
        run: |
          SRC="extracted/app/build/outputs/apk/debug/app-debug.apk"
          DST="NotifyRec-v${{ steps.version.outputs.safe }}.apk"
          test -f "$SRC"
          cp -f "$SRC" "$DST"
          ls -lh "$DST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotifyRec-v${{ steps.version.outputs.safe }}
          path: NotifyRec-v${{ steps.version.outputs.safe }}.apk
          if-no-files-found: error
          retention-days: 14
